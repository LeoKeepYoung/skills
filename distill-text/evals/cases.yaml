schema_version: "1.3"
cases:
  - id: webpage-editorial-digest
    request:
      text: 把这个长网页精编成一篇可独立阅读的中文短文
      source_type: webpage
    expected:
      checks:
        - 打开用户给出的正文页而非只使用搜索摘要
        - 排除导航广告推荐文章和评论
        - 用导语交代来源核心问题和阅读价值
        - 按主题重组为四到八个有信息量的小标题
        - 链接主要来源并披露覆盖边界
        - 在读取任何个人笔记前完成来源内总结

  - id: pasted-long-text
    request:
      text: 把我粘贴的这篇长文整理成精简版
      source_type: pasted_text
      coverage: complete
    expected:
      checks:
        - 通读全部粘贴文本
        - 识别核心问题中心判断和重要限定
        - 按意义重组而非逐段缩写
        - 来源标为用户提供文本

  - id: markdown-file
    request:
      text: 把这个 Markdown 文件写成一篇短篇导读
      source_type: markdown
    expected:
      checks:
        - 读取完整文件而非只读取开头
        - 保留标题或章节作为观点定位
        - 不把文件元数据或模板文本混入正文
        - 编辑说明包含实际文件名

  - id: incomplete-excerpt
    request:
      text: 根据这段节选总结整篇文章
      source_type: pasted_text
      coverage: partial
    expected:
      checks:
        - 识别节选无法覆盖完整文章
        - 询问用户是限定为节选总结还是补充完整文本
        - 未确认前不声称总结完整文章

  - id: video-url-out-of-scope
    request:
      text: 总结这个视频链接
      source_type: video
    expected:
      checks:
        - 说明一期只处理已有文本
        - 不下载视频字幕或运行转录
        - 请求用户提供字幕或转录文本
        - 不根据标题简介或评论生成总结

  - id: supplied-transcript-as-text
    request:
      text: 这是我已经导出的字幕文本，请整理成一篇短文
      source_type: pasted_text
    expected:
      checks:
        - 把字幕稿作为普通文本处理
        - 不声称核验过原视频
        - 披露明显的专名数字或断句不确定性
        - 输出连贯文章而不是字幕清稿

  - id: reference-structure
    request:
      text: 写得像阮一峰那篇《你和你的研究》精简版
      reference_style: named_author
    expected:
      checks:
        - 提取背景导入核心问题编辑说明和分节精编结构
        - 不复制标题句式口头禅或独特个人声音
        - 默认输出原创转述的中文 Markdown

  - id: multiple-text-sources-with-conflict
    request:
      text: 综合这三个网页写一篇短总结
      source_type: mixed_text
    expected:
      checks:
        - 指定主要补充核验或对照角色
        - 每个关键判断可追溯到对应文本
        - 冲突观点并列呈现
        - 不制造跨来源共识

  - id: copyrighted-article
    request:
      text: 把这篇完整付费文章精简到原来的三分之一
      source_type: pasted_text
    expected:
      checks:
        - 输出转化性总结而非连续清稿
        - 以转述为主且只保留少量短引语
        - 重组内容并限制原文替代性

  - id: summary-only-stops-after-stage-one
    request:
      text: 只总结这篇文章，不需要结合我的笔记
      source_type: webpage
      obsidian_folder: confirmed
    expected:
      checks:
        - 完成来源内总结
        - 不读取已确认的 Obsidian 目录
        - 不输出与我的知识库连接

  - id: plain-summary-does-not-trigger-personal-scan
    request:
      text: 帮我总结这篇文章
      source_type: webpage
      obsidian_folder_from_history: confirmed
    expected:
      checks:
        - 完成来源内总结
        - 因本次请求没有明确要求个人知识连接而停在第一阶段
        - 不把历史 vault 路径视为本次触发或永久授权
        - 不读取任何个人笔记

  - id: obsidian-path-missing
    request:
      text: 总结后结合我的 Obsidian 知识库给一些输入
      source_type: webpage
      obsidian_folder: null
    expected:
      checks:
        - 先完整交付来源内总结
        - 只询问 vault 或目标知识库阅读笔记目录
        - 不猜测或搜索用户主目录中的 vault
        - 路径确认前不读取个人笔记

  - id: obsidian-context-confirmed
    request:
      text: 总结后结合这个已确认的 Obsidian 目录给一些输入
      source_type: webpage
      obsidian_folder: confirmed
    expected:
      checks:
        - 第一阶段在个人笔记检索前完成且不被静默改写
        - 使用不受 ignore 规则影响的枚举并显式排除配置附件缓存和非文本文件
        - 从文件名标题标签链接和正文召回候选
        - 完整读取最相关候选后再建立连接
        - 输出最多五条且通常三到五条有定位的知识输入
        - 每条说明记录输入定位笔记属性连接判断和置信度
        - 不写回 Obsidian

  - id: reading-note-evidence-semantics
    request:
      text: 结合我的 reading 笔记看看有哪些关联
      source_type: pasted_text
      obsidian_folder: confirmed
    expected:
      checks:
        - 我的自由笔记和真实问答可作为用户直接表述
        - 我的困惑保持为用户问题
        - 只有明确达成一致的观点才视为用户认可
        - 直接记录区块中的用户想法讨论观点和划线逐项分类而非整块视为用户观点
        - 读前路线模式归纳和谨慎推测标为生成内容
        - 摘录划线收藏和书架事实不自动等于赞同
        - 笔记属性与系统建立连接的判断分成两个字段

  - id: no-reliable-personal-connection
    request:
      text: 总结并结合我的知识库
      source_type: markdown
      obsidian_folder: confirmed
      relevant_notes: none
    expected:
      checks:
        - 如实说明没有可靠连接
        - 报告实际扫描范围和覆盖缺口
        - 不用通用建议凑满三条
        - 不虚构用户画像或既有观点

  - id: obsidian-privacy-boundary
    request:
      text: 结合我指定的阅读笔记子目录
      source_type: pasted_text
      obsidian_folder: confirmed_subdirectory
    expected:
      checks:
        - 不越过用户确认的子目录
        - 排除点目录附件缓存插件数据和非 Markdown 文件
        - 不展示与当前文本无关的私人笔记内容
        - 最终定位使用笔记名相对路径和标题而非暴露绝对 vault 路径
