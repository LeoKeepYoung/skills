schema_version: "1.3"
required_properties:
  workflow:
    - source_only_digest_is_completed_before_personal_note_access
    - stage_one_is_not_silently_rewritten_by_stage_two
    - explicit_summary_only_request_skips_obsidian_access
    - plain_summary_request_does_not_trigger_personal_note_access
    - historical_vault_path_is_not_permanent_authorization
    - missing_obsidian_path_does_not_block_stage_one_delivery
    - missing_obsidian_path_prompts_for_one_confirmed_scope
    - personal_connections_are_inputs_not_automatic_article_rewrites
  scope:
    - phase_one_accepts_only_webpage_pasted_text_markdown_plain_text_and_html
    - supplied_transcripts_are_treated_as_unverified_text
    - video_audio_image_pdf_and_docx_extraction_are_out_of_scope
    - non_text_inputs_request_extracted_text_instead_of_expanding_scope
  acquisition:
    - exact_webpage_body_or_complete_text_is_accessed
    - search_snippets_titles_descriptions_and_comments_are_not_primary_content
    - whole_text_summary_requires_complete_or_substantial_coverage
    - partial_scope_is_explicitly_limited
    - html_navigation_scripts_styles_and_template_noise_are_removed
  editorial:
    - central_question_and_source_thesis_are_identified
    - ideas_are_reorganized_by_meaning_not_mechanical_paragraph_sequence
    - key_examples_and_material_qualifications_are_preserved
    - repetition_filler_ads_and_navigation_are_removed
    - output_is_a_standalone_article_not_a_bullet_dump
    - named_style_references_influence_structure_not_personal_voice
  evidence:
    - source_claims_external_facts_editorial_inference_and_commentary_are_separated
    - main_source_url_or_filename_is_present
    - source_conflicts_are_not_flattened
    - missing_metadata_is_not_invented
  copyright:
    - paraphrase_is_the_default
    - quotes_are_short_accurate_and_located_when_possible
    - output_does_not_substitute_for_the_original_text
  output:
    - default_length_is_approximately_1200_to_2000_chinese_characters
    - introduction_states_source_core_question_and_reading_value
    - body_uses_four_to_eight_informative_headings_when_material_supports_them
    - process_notes_and_quality_gates_are_absent_from_the_article
    - personal_context_is_rendered_in_a_separate_section
    - personal_context_contains_three_to_five_items_when_evidence_supports_them
  obsidian:
    - only_user_confirmed_vault_or_subdirectories_are_read
    - confirmed_scope_is_enumerated_for_markdown_candidates_without_ignore_rule_omissions
    - obsidian_config_trash_git_cache_attachments_and_non_markdown_are_excluded
    - candidate_recall_uses_names_headings_tags_links_and_body
    - relevant_candidate_files_are_read_in_full_before_connection
    - reading_note_standard_sections_keep_their_evidence_semantics
    - mixed_direct_record_blocks_are_classified_item_by_item
    - each_connection_has_note_heading_or_paragraph_locator
    - each_connection_separates_note_attribution_from_connection_judgment
    - each_connection_has_confidence
    - generated_notes_highlights_and_shelf_facts_are_not_user_endorsement
    - no_reliable_match_is_reported_without_filler
    - obsidian_access_is_read_only_by_default
  privacy:
    - user_home_is_not_scanned_to_guess_a_vault
    - confirmed_subdirectory_boundaries_are_respected
    - unrelated_private_content_and_absolute_vault_paths_are_not_exposed
failure_conditions:
  - summary_generated_from_title_or_snippet_only
  - video_or_audio_is_downloaded_or_transcribed_in_phase_one
  - non_text_media_is_analyzed_in_phase_one
  - partial_text_released_as_complete_without_scope_disclosure
  - supplied_transcript_is_claimed_as_verified_against_media
  - source_opinion_rewritten_as_verified_fact
  - important_qualification_removed_to_make_a_stronger_claim
  - long_verbatim_passages_replace_editorial_synthesis
  - named_author_voice_is_imitated
  - personal_notes_are_read_before_stage_one_is_frozen
  - personal_notes_are_read_without_explicit_current_task_intent
  - unconfirmed_obsidian_paths_are_scanned
  - stage_two_changes_source_summary_without_user_request
  - generated_content_or_highlights_are_presented_as_user_belief
  - a_mixed_direct_record_block_is_wholly_presented_as_user_belief
  - a_system_inferred_connection_is_implied_to_be_user_authored
  - weak_keyword_overlap_is_presented_as_a_personal_connection
  - generic_advice_is_used_to_fill_connection_quota
  - obsidian_files_are_written_without_explicit_request
